<!DOCTYPE html>
<html lang="de-CH">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudNova – Produktkatalog</title>
  <meta name="description" content="CloudNova Produktkatalog: Cloud-Dienste aus der Schweiz.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232563eb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="CloudNova Startseite">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="currentColor"/><path d="M9 20a4 4 0 0 1 1-7.9A6 6 0 0 1 21.6 13 3.5 3.5 0 0 1 22 20H9Z" fill="#fff"/></svg>
        <span>Cloud<strong>Nova</strong></span>
      </a>
      <span class="badge" id="instance-badge" hidden></span>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <p class="eyebrow">Produktkatalog</p>
      <h1>Cloud-Dienste für Ihr Unternehmen</h1>
      <p class="lead">Rechenleistung, Speicher, Datenbanken und Sicherheit – einfach, transparent und mit Standort Schweiz.</p>
      <form class="search" id="search-form" role="search">
        <label for="search" class="visually-hidden">Produkte suchen</label>
        <input id="search" type="search" placeholder="Produkt, Beschreibung oder Kategorie suchen …" autocomplete="off" maxlength="100">
        <button type="submit">Suchen</button>
      </form>
    </div>
  </section>

  <main class="container">
    <div class="toolbar">
      <div class="chips" id="chips" role="group" aria-label="Kategorien"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </div>

    <div id="status" class="status" role="status" hidden></div>
    <div id="grid" class="grid" aria-busy="true"></div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© 2026 CloudNova – Schulprojekt M346, Bénédict Schule</span>
      <span>Preise in CHF pro Monat, exkl. MwSt.</span>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
