# Variante B (drei PCs), PC der Datenbank.
# Start:  docker compose -f deploy/compose.db.yml up -d
# Werte stehen in deploy/.env (Vorlage: deploy/.env.example).
name: cloudnova-db

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB fehlt in deploy/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER fehlt in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env}
      APP_DB_USER: ${APP_DB_USER:?APP_DB_USER fehlt in deploy/.env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD fehlt in deploy/.env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Nur an die Tailscale-IP dieses PCs gebunden, NIE an 0.0.0.0.
      # Zusätzlich per Tailscale-ACL nur dem Backend-PC erlauben (docs/tailscale-anleitung.md).
      - "${DB_BIND:?DB_BIND fehlt (Tailscale-IP dieses PCs)}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    pids_limit: 200

volumes:
  db_data:
