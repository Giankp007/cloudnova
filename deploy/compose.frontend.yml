# Variante B (drei PCs), PC des Frontends (hier öffnen alle drei den Browser).
# Start:  docker compose -f deploy/compose.frontend.yml up -d --build
# Nginx leitet /api/ an das Backend auf dem Backend-PC weiter (BACKEND_HOST).
name: cloudnova-frontend

services:
  frontend:
    build: ../frontend
    image: cloudnova/frontend:1.0
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://${BACKEND_HOST:?BACKEND_HOST fehlt (Tailscale-IP des Backend-PCs)}:3000
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
