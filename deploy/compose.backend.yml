# Variante B (drei PCs), PC des Backends.
# Start:  docker compose -f deploy/compose.backend.yml up -d --build
# Das Backend erreicht die Datenbank über die Tailscale-IP des Datenbank-PCs (DB_HOST).
name: cloudnova-backend

services:
  backend:
    build: ../backend
    image: cloudnova/backend:1.0
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: ${DB_HOST:?DB_HOST fehlt (Tailscale-IP des Datenbank-PCs)}
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:?POSTGRES_DB fehlt in deploy/.env}
      DB_USER: ${APP_DB_USER:?APP_DB_USER fehlt in deploy/.env}   # nur SELECT
      DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD fehlt in deploy/.env}
    ports:
      # Nur an die Tailscale-IP dieses PCs gebunden. Das Frontend-PC ruft darüber die API auf.
      - "${BACKEND_BIND:?BACKEND_BIND fehlt (Tailscale-IP dieses PCs)}:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 100
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
